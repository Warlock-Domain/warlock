name: Bug
description: Something in the game does not work as it should
labels: [bug]
body:
  - type: textarea
    id: oque
    attributes:
      label: What happened
      description: And what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repetir
    attributes:
      label: How to reproduce
      description: Step by step (mode, arena, spell, number of bots…).
      placeholder: |
        1. Created a room with 3 bots
        2. Bought Lightning
        3. …
    validations:
      required: true
  - type: input
    id: onde
    attributes:
      label: Where
      description: Browser and device (e.g. Chrome on PC, Safari on iPhone).
    validations:
      required: true
  - type: textarea
    id: prints
    attributes:
      label: Screenshots or video
      description: Drag the images here.
