name: Idea
description: Spell, item, mode, interface or balance change
labels: [ideia, precisa de decisão]
body:
  - type: textarea
    id: oque
    attributes:
      label: What
      description: The idea in a few sentences.
    validations:
      required: true
  - type: textarea
    id: porque
    attributes:
      label: Why
      description: What problem it solves or what it makes more fun.
    validations:
      required: true
  - type: textarea
    id: como
    attributes:
      label: How I picture it
      description: Numbers, a sketch, a reference from another game (Dota, Warcraft 3…). Optional.
  - type: checkboxes
    id: fazer
    attributes:
      label: Who does it
      options:
        - label: I want to open the pull request for this idea
