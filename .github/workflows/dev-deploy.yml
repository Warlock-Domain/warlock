# Ambientes de teste: push na branch <usuário>-dev publica em https://<usuário>-dev-warlock.fernandorffdev.com;
# push na branch dev (dev geral) publica em https://dev-warlock.fernandorffdev.com. Worker e salas próprios; o jogo no ar não é tocado.
name: Ambiente dev

on:
  push:
    branches: ['*-dev', 'dev']
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
      # Cópia do wrangler.jsonc só com nome e domínio trocados: a rota do jogo no ar nunca vai junto
      - name: Configuração do ambiente
        run: |
          node -e '
            const fs = require("fs");
            const b = process.env.BRANCH;
            if (!/^([a-z0-9]+-)?dev$/.test(b)) { console.error("branch deve ser dev ou <usuário>-dev em minúsculas: " + b); process.exit(1); }
            const c = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
            c.name = "warlock-" + b;
            c.routes = [{ pattern: b + "-warlock.fernandorffdev.com", custom_domain: true }];
            fs.writeFileSync("wrangler.dev.json", JSON.stringify(c, null, 2));
            console.log(c.name, "→ https://" + c.routes[0].pattern);
          '
      - run: npx wrangler deploy -c wrangler.dev.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # domínio novo leva alguns segundos para responder na primeira publicação
      - name: Esperar o domínio responder
        run: for i in $(seq 1 30); do curl -sf "https://${BRANCH}-warlock.fernandorffdev.com/api/health" && exit 0; sleep 5; done; exit 1
      - run: node scripts/smoke.mjs "https://${BRANCH}-warlock.fernandorffdev.com"
