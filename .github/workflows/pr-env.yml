# Ambiente de teste por PR: cada PR (rascunho também) publica em https://pr-<n>-warlock.fernandorffdev.com,
# com Worker e salas próprios; ao fechar o PR (mesclado ou não) o Worker e o domínio são apagados.
# Um comentário fixo no PR traz o link e é editado a cada push. PR de fork não recebe segredos: fica sem ambiente.
name: Ambiente do PR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# mesmo grupo para publicar e apagar: fechar o PR cancela um deploy ainda em andamento
concurrency:
  group: ambiente-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}
  NOME: warlock-pr-${{ github.event.pull_request.number }}
  HOST: pr-${{ github.event.pull_request.number }}-warlock.fernandorffdev.com
  GH_TOKEN: ${{ github.token }}
  MARCA: '<!-- ambiente-pr -->'

jobs:
  publicar:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsc e vitest já rodam no CI do mesmo PR
      - run: npx vite build
      # Cópia do wrangler.jsonc só com nome e domínio trocados: a rota do jogo no ar nunca vai junto
      - name: Configuração do ambiente
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
            c.name = process.env.NOME;
            c.routes = [{ pattern: process.env.HOST, custom_domain: true }];
            // forum: no GitHub sign-in here (one OAuth callback URL cannot cover pr-<n> hosts), only "sign in as tester",
            // with a fresh session key per deploy (pushing signs testers out). The key goes as a secret: plain vars are
            // printed in the public deploy log
            c.vars = { ...c.vars, FORUM_TESTER: "1" };
            // sound lab: every PR shares one bucket of its own, so testers never write to the live sounds
            c.r2_buckets = c.r2_buckets.map((b) => ({ ...b, bucket_name: "warlock-sons-pr" }));
            fs.writeFileSync("forum.secrets.json", JSON.stringify({ FORUM_SESSION_KEY: require("crypto").randomBytes(32).toString("hex") }));
            fs.writeFileSync("wrangler.pr.json", JSON.stringify(c, null, 2));
          '
      - run: npx wrangler deploy -c wrangler.pr.json --secrets-file forum.secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # domínio novo leva alguns segundos para responder na primeira publicação
      - name: Esperar o domínio responder
        run: for i in $(seq 1 30); do curl -sf "https://$HOST/api/health" && exit 0; sleep 5; done; exit 1
      # na primeira publicação o domínio novo ainda oscila por alguns segundos: até 3 tentativas
      - run: for i in 1 2 3; do node scripts/smoke.mjs "https://$HOST" && exit 0; sleep 20; done; exit 1
      - name: Comentário com o link
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          corpo="$MARCA
          **Ambiente deste PR:** https://$HOST
          - Versão no ar: commit ${SHA:0:7}; atualiza a cada push no PR.
          - Salas separadas do jogo no ar. Apagado sozinho quando o PR fecha."
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.body | startswith(\"$MARCA\")) | .id" | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$corpo" > /dev/null
          else gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$corpo"; fi

  apagar:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # API direta, sem checkout (o ref de um PR fechado pode não existir mais): é a mesma chamada do `wrangler delete`.
      # O domínio próprio sai junto com o Worker (a doc não diz; medido em 20/10 no PR #134: lista de domínios 12 → 11).
      - name: Apagar o Worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers
        run: |
          # 404 = o Worker nunca chegou a ser publicado (build quebrou ou PR fechado antes)
          code=$(curl -s -o resposta.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$API/services/$NOME?force=true")
          [ "$code" = 200 ] || [ "$code" = 404 ] || { cat resposta.json; exit 1; }
          echo "Worker $NOME: HTTP $code"
      - name: Comentário de ambiente apagado
        run: |
          corpo="$MARCA
          **Ambiente deste PR:** apagado (PR fechado). Reabrir o PR publica de novo."
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.body | startswith(\"$MARCA\")) | .id" | head -1)
          [ -n "$id" ] && gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$corpo" > /dev/null || true
