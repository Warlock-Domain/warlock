# Checagens de todo pull request e de todo envio para o master: tipos, testes e build
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: node scripts/room-cleanup.mjs
      - run: node scripts/lobby-reconcile.mjs
      - run: npx vite build
